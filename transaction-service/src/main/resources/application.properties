spring.application.name=transaction-service
# FinFlow-dedicated port (commerce 18083, notification 18084)
server.port=18085

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/transaction?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

identity.jwks-url=http://localhost:18081/.well-known/jwks.json
identity.jwks-cache-seconds=300

# wallet = call wallet-service; simulated = in-process balances (tests / offline demo)
wallet.provider=wallet
wallet.base-url=http://localhost:18082

transaction.events.kafka-enabled=false
transaction.events.topic=transaction.events
spring.kafka.bootstrap-servers=localhost:9092
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
