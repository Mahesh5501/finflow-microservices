# Standalone development only. Activate with --spring.profiles.active=local.
# The filter refuses token-free startup on a public bind address or another profile.
server.address=127.0.0.1
commerce.security.jwt-validation-enabled=false
commerce.security.local-user-id=1
commerce.security.local-organisation-ids=10

# No Wallet service or bearer token is needed for local checkout/refund simulation.
payment.provider=simulated
