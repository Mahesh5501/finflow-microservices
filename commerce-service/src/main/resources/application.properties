spring.application.name=commerce-service
# FinFlow-dedicated port
server.port=18083

# DB name = service name; JDBC creates it if missing
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/commerce?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

# Identity JWKS — commerce verifies RS256 access tokens
identity.jwks-url=http://localhost:18081/.well-known/jwks.json
identity.jwks-cache-seconds=300

# Payment: simulated (default/tests) | wallet (debits wallet-service with caller JWT)
payment.provider=wallet
wallet.base-url=http://localhost:18082

# Domain events — logging by default; set kafka-enabled=true + bootstrap when infra Kafka is up
commerce.events.kafka-enabled=false
commerce.events.topic=commerce.events
spring.kafka.bootstrap-servers=localhost:9092
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Stock hold TTL for unpaid orders; abandoned cart purge
commerce.maintenance.enabled=true
commerce.reservation-ttl-minutes=30
commerce.cart-abandon-hours=72
commerce.maintenance.reservation-fixed-delay-ms=60000
commerce.maintenance.cart-fixed-delay-ms=300000
