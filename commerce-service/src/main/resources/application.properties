spring.application.name=commerce-service
# FinFlow-dedicated port
server.port=18083

# DB name = service name; JDBC creates it if missing
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/commerce?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Redis Configuration (matching identity-service & docker-compose)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# Cache configuration (Redis-backed)
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Identity JWKS — commerce verifies RS256 access tokens
identity.jwks-url=http://localhost:18081/.well-known/jwks.json
identity.jwks-cache-seconds=300

# Payment: simulated (default/tests) | wallet (debits wallet-service with caller JWT)
payment.provider=wallet
wallet.base-url=http://localhost:18082

# Resilience4j Circuit Breaker Config for Wallet Service
resilience4j.circuitbreaker.instances.walletService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.walletService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.walletService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.walletService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.walletService.permittedNumberOfCallsInHalfOpenState=3

# Domain events — logging by default; set kafka-enabled=true + bootstrap when infra Kafka is up
commerce.events.kafka-enabled=false
commerce.events.topic=commerce.events
spring.kafka.bootstrap-servers=localhost:9092
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Stock hold TTL for unpaid orders; abandoned cart purge
commerce.maintenance.enabled=true
commerce.reservation-ttl-minutes=30
commerce.cart-abandon-hours=72
commerce.maintenance.reservation-fixed-delay-ms=60000
commerce.maintenance.cart-fixed-delay-ms=300000
