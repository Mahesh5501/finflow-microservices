spring.datasource.url=jdbc:h2:mem:commerce_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Exercise caching without requiring an external Redis process. Production stays Redis.
spring.cache.type=simple
identity.jwks-url=http://localhost:18081/.well-known/jwks.json
identity.jwks-cache-seconds=300
payment.provider=simulated
commerce.events.kafka-enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
commerce.reservation-ttl-minutes=30
commerce.cart-abandon-hours=72
