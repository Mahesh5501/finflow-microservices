spring.application.name=wallet-service
# FinFlow-dedicated port (avoids clashes with common 8080/8082 apps)
server.port=18082

# DB name = service name; JDBC creates it if missing (no infra init SQL)
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/wallet?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

# Identity JWKS — wallet verifies RS256 access tokens (no shared HMAC secret)
identity.jwks-url=http://localhost:18081/.well-known/jwks.json
identity.jwks-cache-seconds=300
