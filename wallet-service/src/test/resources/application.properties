# In-memory H2 so tests do not need a personal MySQL.
# Production profile still uses MySQL — keep dialects in mind for advanced SQL.
spring.datasource.url=jdbc:h2:mem:wallet_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Service tests call WalletService directly (no HTTP/JWT). URL only needed for bean wiring.
identity.jwks-url=http://localhost:18081/.well-known/jwks.json
identity.jwks-cache-seconds=300
