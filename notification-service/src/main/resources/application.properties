spring.application.name=notification-service
server.port=18084

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/notification?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

identity.jwks-url=http://localhost:18081/.well-known/jwks.json
identity.jwks-cache-seconds=300

# Kafka consumer — off by default (logging path unused; handler still testable in-process)
notification.kafka-enabled=false
notification.events.topic=commerce.events
notification.events.group=notification-service
spring.kafka.bootstrap-servers=localhost:9092
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

mail.enabled=false
