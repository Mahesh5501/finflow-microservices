# Tests do not call real identity; jwk-set-uri only needed when security validates a token.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:18081/.well-known/jwks.json
identity.uri=http://localhost:18081
wallet.uri=http://localhost:18082
commerce.uri=http://localhost:18083
notification.uri=http://localhost:18084
app.http.connect-timeout-ms=2000
app.http.response-timeout-ms=5000
