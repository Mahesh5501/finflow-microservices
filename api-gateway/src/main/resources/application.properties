spring.application.name=api-gateway

# FinFlow-dedicated port
server.port=18080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Identity JWKS — edge JWT verification
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${identity.uri}/.well-known/jwks.json

# Downstream services
identity.uri=http://localhost:18081
wallet.uri=http://localhost:18082
commerce.uri=http://localhost:18083
notification.uri=http://localhost:18084

# Rate limit — shared Docker Redis (infrastructure/)
app.rate-limit.replenish-rate=50
app.rate-limit.burst-capacity=100
app.rate-limit.requested-tokens=1

# Shared Docker Redis (infrastructure/) — keyspace prefix gateway: via RateLimitConfig
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# HTTP client timeouts toward downstreams
app.http.connect-timeout-ms=2000
app.http.response-timeout-ms=5000

# Max inbound body (bytes)
app.max-body-bytes=1048576

# CORS (tighten origins in real prod)
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.max-age-seconds=3600

# Actuator / metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics,gateway
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
