
# ============================================================
# 1. APPLICATION
# ============================================================

# Logical name of this Spring Boot application.
# Used in application identification, logs and metrics.
spring.application.name=api-gateway

# Port on which the API Gateway accepts incoming requests.
server.port=18080

# Allow Spring Boot to stop gracefully instead of terminating immediately.
server.shutdown=graceful

# Maximum time Spring Boot waits for active requests to finish during shutdown.
# This works together with graceful shutdown.
spring.lifecycle.timeout-per-shutdown-phase=30s


# ============================================================
# 2. JWT AUTHENTICATION
# ============================================================

# Identity Service publishes its public signing keys at this endpoint.
# The gateway uses these keys to verify incoming JWT signatures.
# The identity.uri property is defined in the downstream services section.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${identity.uri}/.well-known/jwks.json


# ============================================================
# 3. DOWNSTREAM MICROSERVICES
# ============================================================

# Base URLs of the services to which the gateway forwards requests.
# Keep these values configurable so they can be changed for Docker,
# local development, staging and production without changing Java code.

identity.uri=http://localhost:18081
wallet.uri=http://localhost:18082
commerce.uri=http://localhost:18083
notification.uri=http://localhost:18084


# ============================================================
# 4. RATE LIMITING
# ============================================================

# Token-bucket rate-limiting settings used by RateLimitConfig.
#
# replenish-rate:
# Number of tokens added to the bucket per second.
#
# burst-capacity:
# Maximum number of tokens the bucket can hold.
# Allows temporary bursts of requests.
#
# requested-tokens:
# Number of tokens consumed by each request.
#
# Example:
# replenish-rate=50 means 50 tokens are added per second.
# burst-capacity=100 allows a temporary burst of up to 100 tokens.
# requested-tokens=1 means each request consumes one token.

app.rate-limit.replenish-rate=50
app.rate-limit.burst-capacity=100
app.rate-limit.requested-tokens=1


# ============================================================
# 5. REDIS CONNECTION
# ============================================================

# Redis connection used by the gateway's RedisRateLimiter.
# Redis is shared through the repository's Docker Compose setup.

# Redis server hostname.
# Use localhost when running the gateway directly on your machine.
# Use the Redis container/service name when running inside Docker.
spring.data.redis.host=localhost

# Default Redis server port.
spring.data.redis.port=6379

# Maximum time to wait for Redis operations before timing out.
spring.data.redis.timeout=2s


# ============================================================
# 6. DOWNSTREAM HTTP CLIENT TIMEOUTS
# ============================================================

# Maximum time to establish a connection to a downstream service.
# Unit: milliseconds.
app.http.connect-timeout-ms=2000

# Maximum time to wait for a downstream HTTP response.
# Unit: milliseconds.
app.http.response-timeout-ms=5000


# ============================================================
# 7. CORS
# ============================================================

# Origins allowed to call the gateway from a browser.
# "*" allows requests from any origin.
# Replace this with specific frontend origins in production.
app.cors.allowed-origins=*

# HTTP methods allowed for cross-origin requests.
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# Request headers allowed in cross-origin requests.
# "*" allows all request headers.
app.cors.allowed-headers=*

# How long browsers can cache the result of a CORS preflight request.
# Unit: seconds.
# 3600 seconds = 1 hour.
app.cors.max-age-seconds=3600


# ============================================================
# 8. ACTUATOR AND METRICS
# ============================================================

# Expose only the health endpoint over HTTP for now.
# Other Actuator endpoints are not permitted by the current SecurityConfig.
management.endpoints.web.exposure.include=health

# Show detailed health information only to authorized users.
# Unauthenticated callers receive limited health information.
management.endpoint.health.show-details=when_authorized

# Enable liveness and readiness health groups.
# Useful for container orchestration and deployment health checks.
management.endpoint.health.probes.enabled=true

# Add the application name as a common tag to application metrics.
# Helps identify which service produced a metric.
management.metrics.tags.application=${spring.application.name}
