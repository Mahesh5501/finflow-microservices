spring.application.name=identity-service
# FinFlow-dedicated port (avoids clashes with common 8080/8081 apps)
server.port=18081

# DB name = service name; JDBC creates it if missing (no infra init SQL)
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/identity?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Access JWT (RS256). Public key published at /.well-known/jwks.json
jwt.access-expiration-ms=900000
# Local bootstrap creates this key once; keep it outside target/ and preserve it across restarts.
# Production: use an absolute path to a protected durable secret and disable generation.
jwt.signing-key-path=${IDENTITY_SIGNING_KEY_PATH:.local/identity/signing-key.pk8}
jwt.generate-key-if-missing=${IDENTITY_GENERATE_KEY_IF_MISSING:true}
jwt.refresh-expiration-ms=604800000
password-reset-expiration-ms=1800000
email-verification-expiration-ms=86400000
invite-expiration-ms=604800000

# Mail off = Postman gets tokens in JSON. On = SMTP via application-local.properties (gitignored).
mail.enabled=false
mail.from=

# Login / forgot-password / resend-verification (shared Docker Redis required)
rate-limit.max-attempts=10
rate-limit.window-ms=600000

# Shared Docker Redis (repo root docker-compose.yml) — keys identity:ratelimit:*
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

management.endpoints.web.exposure.include=health,info

# Optional local SMTP (last so it overrides mail.enabled). See application-local.properties.example.
spring.config.import=optional:file:./application-local.properties
