spring.datasource.url=jdbc:h2:mem:identity_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
password-reset-expiration-ms=1800000
email-verification-expiration-ms=86400000
invite-expiration-ms=604800000
mail.enabled=false
rate-limit.max-attempts=1000
rate-limit.window-ms=600000

# Same shared Docker Redis as main (infrastructure/) — no in-memory rate limit
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
